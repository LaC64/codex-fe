<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Codex-FE Host</title>
	<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="tab-bar">
		<div class="tab-strip" id="tabs">
			<button class="tab-add" id="tab-add" type="button" title="New PowerShell tab" aria-label="New PowerShell tab">+</button>
			<button class="tab-picker" id="tab-picker" type="button" title="Open Codex-FE picker" aria-label="Open Codex-FE picker">&#x1f916;</button>
		</div>
		<div class="status" id="status">Starting...</div>
	</header>
	<main id="terminals">
		<div class="empty" id="empty">No tabs open. Choose a Codex session or press + for PowerShell.</div>
	</main>
	<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
	<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
	<script src="renderer.js"></script>
</body>
</html>
