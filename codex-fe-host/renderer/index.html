<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Codex-FE Host</title>
	<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="tab-bar">
		<div class="tab-strip" id="tabs">
			<button class="tab-add" id="tab-add" type="button" title="New PowerShell tab" aria-label="New PowerShell tab">+</button>
			<button class="tab-picker" id="tab-picker" type="button" title="Open Codex-FE picker" aria-label="Open Codex-FE picker">
				<svg class="robot-icon" viewBox="0 0 20 20" aria-hidden="true">
					<path d="M10 2v3M1.5 9v3M18.5 9v3M7 12.5h6"></path>
					<circle cx="10" cy="2" r="1"></circle>
					<rect x="3.5" y="5" width="13" height="10.5" rx="2"></rect>
					<circle cx="7.5" cy="9.5" r="1"></circle>
					<circle cx="12.5" cy="9.5" r="1"></circle>
				</svg>
			</button>
		</div>
		<div class="status" id="status">Starting...</div>
	</header>
	<main id="terminals">
		<div class="empty" id="empty">No tabs open. Choose a Codex session or press + for PowerShell.</div>
	</main>
	<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
	<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
	<script src="renderer.js"></script>
</body>
</html>
